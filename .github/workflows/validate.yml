name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Windows validation
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          global-json-file: global.json

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
          run_install: false

      - name: Require PowerShell 7.5+
        shell: pwsh
        run: |
          if ($PSVersionTable.PSEdition -ne 'Core' -or $PSVersionTable.PSVersion -lt [Version]'7.5') { throw 'Validation requires PowerShell 7.5+ (pwsh); Windows PowerShell and pwsh 7.4 are unsupported.' }

      - name: Validate repository
        shell: pwsh
        run: ./tools/validate.ps1 -Profile Local

      - name: Validate certification contract
        shell: pwsh
        run: ./tools/verify-test-results.ps1 -MatrixOnly -RepositoryRoot $PWD
