name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Windows validation
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Require PowerShell 7.5+
        shell: pwsh
        run: |
          if ($PSVersionTable.PSEdition -ne 'Core' -or $PSVersionTable.PSVersion -lt [Version]'7.5') { throw 'Validation requires PowerShell 7.5+ (pwsh); Windows PowerShell and pwsh 7.4 are unsupported.' }

      - name: Validate repository
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/ci | Out-Null
          Start-Transcript -Path artifacts/ci/local-validation.log
          try {
            ./tools/validate.ps1 -Profile Local -TestResultsDirectory artifacts/ci/test-results
          } finally {
            Stop-Transcript
          }

      - name: Validate certification contract
        shell: pwsh
        run: ./tools/verify-test-results.ps1 -MatrixOnly -RepositoryRoot $PWD

      - name: Publish validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-local-validation
          path: artifacts/ci/
          if-no-files-found: warn

  postgresql:
    name: PostgreSQL 18 functional tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.4-bookworm@sha256:7e6103cf85f88f7a0eddb3ec0b1ba8940eba098ed118ade25a729ca9daee5568
        env:
          POSTGRES_DB: sqlobserver_test_admin
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sqlobserver-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sqlobserver_test_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SQLOBSERVER_VALIDATION_PROFILE: Local
      SQLOBSERVER_LOCAL_POSTGRES: Host=127.0.0.1;Port=5432;Database=sqlobserver_test_admin;Username=postgres;Password=sqlobserver-ci-only;Pooling=false
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        shell: bash
        run: |
          mkdir -p artifacts/ci
          dotnet restore SqlObserver.slnx --configfile NuGet.Config --locked-mode 2>&1 | tee artifacts/ci/restore.log

      - name: Test repository behavior and role boundaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/ci | Out-Null
          Start-Transcript -Path artifacts/ci/postgresql.log
          $testExitCode = 1
          try {
            dotnet test tests/SqlObserver.IntegrationTests.PostgreSql/SqlObserver.IntegrationTests.PostgreSql.csproj --configuration Release --no-restore --filter 'Category=RequiresPostgreSql&Category!=RequiresM12ReportsRelease&Category!=RequiresM12ObservabilityRelease' --logger 'trx;LogFileName=postgresql.trx' --results-directory artifacts/ci/test-results
            $testExitCode = $LASTEXITCODE
          } finally {
            Stop-Transcript
          }
          exit $testExitCode

      - name: Test operational-health repository journey
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/ci | Out-Null
          Start-Transcript -Path artifacts/ci/postgresql-journey.log
          $testExitCode = 1
          try {
            dotnet test tests/SqlObserver.EndToEndTests/SqlObserver.EndToEndTests.csproj --configuration Release --no-restore --filter 'Category=RequiresPostgreSql' --logger 'trx;LogFileName=postgresql-journey.trx' --results-directory artifacts/ci/test-results
            $testExitCode = $LASTEXITCODE
          } finally {
            Stop-Transcript
          }
          exit $testExitCode

      - name: Capture PostgreSQL service log
        if: always()
        shell: bash
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          mkdir -p artifacts/ci
          docker logs "$POSTGRES_CONTAINER_ID" > artifacts/ci/postgresql-service.log 2>&1

      - name: Publish PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postgresql-functional-validation
          path: artifacts/ci/
          if-no-files-found: warn
